services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SERVER_CONTAINER_NAME:-clicky-server}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-for-local-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://clicky:clicky_dev_password@db:5432/clicky_store?sslmode=disable}
      ADMIN_NAME: ${ADMIN_NAME:-Clicky Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clicky.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PORT:-8080}/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: ${SERVER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${SERVER_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${SERVER_HEALTHCHECK_RETRIES:-5}
      start_period: ${SERVER_HEALTHCHECK_START_PERIOD:-10s}

  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: ${DB_CONTAINER_NAME:-clicky-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clicky_store}
      POSTGRES_USER: ${POSTGRES_USER:-clicky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clicky_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgresql}:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-clicky} -d ${POSTGRES_DB:-clicky_store}",
        ]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-5}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}
